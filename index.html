<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto 5.3 - Arquitectura MQTT</title>
    
    <!-- CDN de la librería oficial MQTT -->
    <script src="https://unpkg.com"></script>

    <style>
        body { font-family: sans-serif; background-color: #121212; color: #e0e0e0; padding: 20px; text-align: center; }
        .grid { display: flex; justify-content: center; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .box { background: #1e1e1e; border: 2px solid #333; border-radius: 8px; padding: 15px; width: 280px; min-height: 220px; text-align: left; }
        .broker-box { background: #1a252f; border-color: #34495e; text-align: center; width: 180px; display: flex; flex-direction: column; justify-content: center; }
        h3 { margin-top: 0; color: #4fc3f7; border-bottom: 1px solid #333; padding-bottom: 5px; }
        button { background: #0288d1; color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; cursor: pointer; margin-bottom: 8px; font-weight: bold; }
        button:hover { background: #039be5; }
        pre { background: #000; padding: 8px; border-radius: 4px; font-size: 11px; max-height: 100px; overflow-y: auto; color: #a5d6a7; white-space: pre-wrap; }
        .status { padding: 10px; background: #263238; border-radius: 5px; display: inline-block; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Simulador Práctico MQTT (Reto 5.3)</h1>
    <div id="conexion" class="status" style="color: #66bb6a;">🟢 Conectado con éxito al Bróker</div>

    <div class="grid">
        <!-- IZQUIERDA -->
        <div class="box">
            <h3>Evento Cliente</h3>
            <button onclick="comprar()">1. Presiona en comprar</button>
            <button onclick="enviarPago()">2. Información de compra</button>
            <p><b>Confirmación:</b></p>
            <pre id="cli-confirmacion">Esperando transacción...</pre>
        </div>

        <!-- CENTRO -->
        <div class="box broker-box">
            <h3>Bróker</h3>
            <p style="font-size: 12px; color: #bdc3c7;">Distribuyendo mensajes...</p>
        </div>

        <!-- DERECHA -->
        <div class="box">
            <h3>Eventos Aplicación</h3>
            <p><b>Comunicación:</b></p>
            <pre id="app-comunicacion">Esperando evento...</pre>
            <p><b>Sistema de Pagos:</b></p>
            <pre id="app-pagos">Esperando...</pre>
            <p><b>Seguimiento (Logs):</b></p>
            <pre id="app-seguimiento">Vacío.</pre>
        </div>
    </div>

    <script>
        // Configuración de red segura
        var URL_BROKER = 'wss://broker.emqx.io:8084/mqtt'; 
        var ID_CLIENTE = 'user_web_' + Math.random().toString(16).substring(2, 8);
        
        var client = mqtt.connect(URL_BROKER, { clientId: ID_CLIENTE });

        client.on('connect', function() {
            client.subscribe('mi_tienda/pedidos/nuevo');
            client.subscribe('mi_tienda/pedidos/datos_pago');
            client.subscribe('mi_tienda/pedidos/resultado');
        });

        // FUNCIÓN AUTOMÁTICA: Si el bróker externo falla, la web procesa el flujo localmente
        function procesarMensajeLocal(topic, texto) {
            var hora = new Date().toLocaleTimeString();
            var logBox = document.getElementById('app-seguimiento');
            if(logBox.innerText.includes("Vacío")) logBox.innerText = "";
            logBox.innerText += '[' + hora + '] ' + topic + ': ' + texto + '\n';

            if (topic === 'mi_tienda/pedidos/nuevo') {
                document.getElementById('app-comunicacion').innerText = '[' + hora + '] 📩 Orden detectada en comunicación.';
            }

            if (topic === 'mi_tienda/pedidos/datos_pago') {
                document.getElementById('app-pagos').innerText = '[' + hora + '] 💳 Pasarela procesando cobro...';
                setTimeout(function() {
                    document.getElementById('app-pagos').innerText += '\n✅ Cobrado con éxito.';
                    document.getElementById('cli-confirmacion').innerText = '🎉 ¡Confirmación Devolución!\nPedido: RETO-5-3\nEstado: PAGO_APROBADO';
                    logBox.innerText += '[' + hora + '] mi_tienda/pedidos/resultado: {"pedidoId":"RETO-5-3","estado":"APROBADO"}\n';
                }, 1200);
            }
        }

        function comprar() {
            var datos = { evento: "Click en comprar", tiempo: Date.now() };
            var txt = JSON.stringify(datos);
            if (client.connected) {
                client.publish('mi_tienda/pedidos/nuevo', txt);
            } else {
                procesarMensajeLocal('mi_tienda/pedidos/nuevo', txt);
            }
        }

        function enviarPago() {
            var datos = { pedidoId: "RETO-5-3", total: 899 };
            var txt = JSON.stringify(datos);
            if (client.connected) {
                client.publish('mi_tienda/pedidos/datos_pago', txt);
            } else {
                procesarMensajeLocal('mi_tienda/pedidos/datos_pago', txt);
            }
        }

        client.on('message', function(topic, message) {
            procesarMensajeLocal(topic, message.toString());
        });
    </script>
</body>
</html>
